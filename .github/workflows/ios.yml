name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build, test, screenshots
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Choose an iPhone simulator
        id: sim
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          rows = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              version = (int(match.group(1)), int(match.group(2))) if match else (0, 0)
              for device in devices:
                  name = device.get("name", "")
                  if not device.get("isAvailable") or "iPhone" not in name:
                      continue
                  rows.append((version, name, device["udid"]))
          if not rows:
              raise SystemExit("No available iPhone simulator")
          def score(row):
              version, name, _ = row
              if "Pro" in name and "Max" not in name:
                  kind = 3
              elif "Pro" in name:
                  kind = 2
              elif "SE" in name or "mini" in name:
                  kind = 0
              else:
                  kind = 1
              return (version, kind, name)
          chosen = max(rows, key=score)
          print(f"Chosen {chosen[1]} on iOS {chosen[0][0]}.{chosen[0][1]} ({chosen[2]})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"udid={chosen[2]}\n")
              handle.write(f"name={chosen[1]}\n")
          PY

      - name: Prepare screenshot directory
        run: mkdir -p ios/build/screenshots

      - name: Run unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Altitude.xcodeproj \
            -scheme Altitude \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | tee ios/build/xcodebuild.log

      - name: Package the simulator app
        if: always()
        run: |
          APP="ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Altitude.app"
          if [ ! -d "$APP" ]; then
            APP=$(find ios/build/DerivedData -type d -name 'Altitude.app' | head -1 || true)
          fi
          if [ -n "${APP}" ] && [ -d "${APP}" ]; then
            echo "Packaging ${APP}"
            ditto -c -k --keepParent "${APP}" ios/build/Altitude-iphonesimulator.zip
          else
            echo "Simulator app was not produced"
            exit 1
          fi

      - name: Unsigned device archive
        if: always()
        continue-on-error: true
        run: |
          set +e
          xcodebuild build \
            -project ios/Altitude.xcodeproj \
            -scheme Altitude \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build/DeviceDerived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          APP="ios/build/DeviceDerived/Build/Products/Release-iphoneos/Altitude.app"
          if [ -d "$APP" ]; then
            ditto -c -k --keepParent "$APP" ios/build/Altitude-iphoneos-unsigned.zip
          fi
          xcodebuild archive \
            -project ios/Altitude.xcodeproj \
            -scheme Altitude \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/Altitude.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          if [ -d ios/build/Altitude.xcarchive ]; then
            ditto -c -k --keepParent ios/build/Altitude.xcarchive ios/build/Altitude-unsigned.xcarchive.zip
          fi

      - name: Collect screenshots
        if: always()
        run: |
          set +e
          mkdir -p ios/build/screenshots
          find "$GITHUB_WORKSPACE" "$HOME" /tmp -type d -name altitude-screenshots -prune -exec cp -n {}/*.png ios/build/screenshots/ \;
          if [ -d ios/build/TestResults.xcresult ]; then
            rm -rf ios/build/xcattachments
            xcrun xcresulttool export attachments \
              --path ios/build/TestResults.xcresult \
              --output-path ios/build/xcattachments \
              > ios/build/attachment-export.txt \
              || xcrun xcresulttool export \
                --type attachments \
                --path ios/build/TestResults.xcresult \
                --output-path ios/build/xcattachments \
                > ios/build/attachment-export.txt
            python3 - <<'PY'
          import os, re, shutil
          root = "ios/build/xcattachments"
          dest = "ios/build/screenshots"
          os.makedirs(dest, exist_ok=True)
          log = "ios/build/attachment-export.txt"
          text = open(log, encoding="utf-8", errors="replace").read() if os.path.exists(log) else ""
          wanted = (
              "display-en",
              "settings-en",
              "settings-zh",
              "settings-fr",
              "camera-portrait-back",
              "camera-portrait-front",
              "camera-landscape-back",
              "camera-landscape-front",
          )
          for match in re.finditer(r'File:\s*(\S+\.png),\s*suggested name:\s*"([^"]+)"', text):
              source_name, suggested = match.group(1), match.group(2)
              stable = next((name for name in wanted if suggested.startswith(name)), None)
              if stable is None:
                  continue
              found = None
              for dirpath, _, files in os.walk(root):
                  if source_name in files or os.path.basename(source_name) in files:
                      found = os.path.join(dirpath, os.path.basename(source_name))
                      break
              if found and os.path.exists(found):
                  target = os.path.join(dest, stable + ".png")
                  if not os.path.exists(target):
                      shutil.copy2(found, target)
                      print("named", target)
          PY
          fi
          echo "screenshot directory:"
          find ios/build/screenshots -name '*.png' -print
          missing=0
          for name in display-en settings-en settings-zh settings-fr camera-portrait-back camera-portrait-front camera-landscape-back camera-landscape-front; do
            if [ ! -f "ios/build/screenshots/${name}.png" ]; then
              echo "missing ${name}.png"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Expected screenshot names were not all collected"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios/build/screenshots/*.png
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: |
            ios/build/TestResults.xcresult
            ios/build/xcodebuild.log
          if-no-files-found: warn

      - name: Upload unsigned builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-build
          path: |
            ios/build/Altitude-iphonesimulator.zip
            ios/build/Altitude-iphoneos-unsigned.zip
            ios/build/Altitude-unsigned.xcarchive.zip
          if-no-files-found: warn
