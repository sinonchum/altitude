name: Altitude
options:
  bundleIdPrefix: app.altitude
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      ENABLE_TESTABILITY: NO
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  Altitude:
    type: application
    platform: iOS
    sources:
      - path: Altitude
        excludes:
          - Info.plist
          - Resources/egm96-15.bin
      - path: Altitude/Resources/egm96-15.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.altitude.ios
        PRODUCT_NAME: Altitude
        INFOPLIST_FILE: Altitude/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  AltitudeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AltitudeTests
      - path: Altitude/Resources/egm96-15.bin
        buildPhase: resources
    dependencies:
      - target: Altitude
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.altitude.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Altitude.app/Altitude"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  AltitudeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AltitudeUITests
    dependencies:
      - target: Altitude
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.altitude.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Altitude
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  Altitude:
    shared: true
    build:
      targets:
        Altitude: all
        AltitudeTests: [test]
        AltitudeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AltitudeTests
        - AltitudeUITests
      environmentVariables:
        - variable: SCREENSHOT_DIR
          value: $(SRCROOT)/build/screenshots
          isEnabled: true
